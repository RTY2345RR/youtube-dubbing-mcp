name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        mcp: ["mcp>=1.9,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -e ".[dev]" "${{ matrix.mcp }}"
      - run: python -m pytest
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build && uvx twine check dist/*
      - name: Install the wheel with uvx and list tools
        run: uvx --from dist/*.whl youtube-dubbing-mcp --print-config cursor
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t youtube-dubbing-mcp:ci .
      - run: docker run --rm youtube-dubbing-mcp:ci --version
