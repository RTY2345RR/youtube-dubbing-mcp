# Release -> PyPI (trusted publishing), official MCP Registry, and Docker Hub (when DOCKERHUB_TOKEN is set).
name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for PyPI
        run: sleep 60
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and push miragea/youtube-dubbing-mcp
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u miragea --password-stdin
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          docker build -t miragea/youtube-dubbing-mcp:$VERSION -t miragea/youtube-dubbing-mcp:latest .
          docker push miragea/youtube-dubbing-mcp:$VERSION
          docker push miragea/youtube-dubbing-mcp:latest
