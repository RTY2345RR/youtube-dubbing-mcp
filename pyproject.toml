[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "youtube-dubbing-mcp"
version = "0.1.0"
description = "YouTube dubbing MCP server: AI dubbing for Claude, Cursor and Codex with one cloned voice per speaker, synced SRT captions and YouTube multi-language audio tracks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RTY2345RR" }]
keywords = [
  "youtube-dubbing", "ai-dubbing", "youtube-dubbing-mcp", "dubbing-mcp", "mcp", "mcp-server", "model-context-protocol",
  "video-dubbing", "video-translation", "voice-cloning", "multi-speaker", "youtube-multi-language-audio",
  "audio-tracks", "subtitles", "srt", "claude", "cursor", "codex", "elevenlabs-alternative", "miragea",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=1.9,<3",
  "httpx>=0.27",
  "yt-dlp>=2025.1.1",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "build", "twine"]

[project.urls]
Homepage = "https://github.com/RTY2345RR/youtube-dubbing-mcp"
Demo = "https://huggingface.co/spaces/miragea/youtube-dubbing-mcp"
Repository = "https://github.com/RTY2345RR/youtube-dubbing-mcp"
Documentation = "https://github.com/RTY2345RR/youtube-dubbing-mcp#readme"
Issues = "https://github.com/RTY2345RR/youtube-dubbing-mcp/issues"
Changelog = "https://github.com/RTY2345RR/youtube-dubbing-mcp/blob/main/CHANGELOG.md"
"Voice engine" = "https://miragea.ai"

[project.scripts]
youtube-dubbing-mcp = "youtube_dubbing_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_dubbing_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "docs/", "README.md", "LICENSE", "CHANGELOG.md", "llms.txt", "server.json", "smithery.yaml", "glama.json", "Dockerfile", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
